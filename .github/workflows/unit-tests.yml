name: Unit tests
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
jobs:
    unit:
        runs-on: ubuntu-latest
        # `prisma generate` never opens a connection — the URL is only read
        # by the strict env() resolver in prisma.config.ts.
        env:
            DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - run: npx prisma generate
            - run: npm run lint
            - run: npm test